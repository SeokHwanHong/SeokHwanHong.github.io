<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">노르웨이 전력망별 SARIMAX와 XGBoost RMSE 비교</title>
  <desc id="desc">Grid 1, Grid 2, Grid 3에서 XGBoost의 RMSE가 SARIMAX보다 낮다.</desc>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="72" y="55" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">전력망별 RMSE 비교</text>
  <text x="72" y="84" font-family="Pretendard, Arial, sans-serif" font-size="15" fill="#64748b">낮을수록 예측 오차가 작음</text>
  <g font-family="Pretendard, Arial, sans-serif" font-size="13" fill="#64748b">
    <line x1="92" y1="405" x2="910" y2="405" stroke="#94a3b8"/>
    <line x1="92" y1="320" x2="910" y2="320" stroke="#e2e8f0"/>
    <line x1="92" y1="235" x2="910" y2="235" stroke="#e2e8f0"/>
    <line x1="92" y1="150" x2="910" y2="150" stroke="#e2e8f0"/>
    <line x1="92" y1="65" x2="910" y2="65" stroke="#e2e8f0"/>
    <text x="64" y="409">0</text><text x="56" y="324">10</text><text x="56" y="239">20</text><text x="56" y="154">30</text><text x="56" y="69">40</text>
  </g>
  <g>
    <rect x="180" y="105" width="64" height="300" rx="4" fill="#94a3b8"/><rect x="254" y="378" width="64" height="27" rx="4" fill="#2563eb"/>
    <rect x="440" y="307" width="64" height="98" rx="4" fill="#94a3b8"/><rect x="514" y="371" width="64" height="34" rx="4" fill="#2563eb"/>
    <rect x="700" y="385" width="64" height="20" rx="4" fill="#94a3b8"/><rect x="774" y="402" width="64" height="3" rx="2" fill="#2563eb"/>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="212" y="96">35.330</text><text x="286" y="369">3.125</text>
    <text x="472" y="298">11.497</text><text x="546" y="362">4.011</text>
    <text x="732" y="376">2.396</text><text x="806" y="393">0.371</text>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="249" y="445">Grid 1</text><text x="509" y="445">Grid 2</text><text x="769" y="445">Grid 3</text>
  </g>
  <g font-family="Pretendard, Arial, sans-serif" font-size="14" fill="#475569">
    <rect x="676" y="473" width="14" height="14" rx="2" fill="#94a3b8"/><text x="699" y="485">SARIMAX</text>
    <rect x="790" y="473" width="14" height="14" rx="2" fill="#2563eb"/><text x="813" y="485">XGBoost</text>
  </g>
</svg>